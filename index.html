<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cena de fin de año</title>
<style>
  :root {
    color-scheme: light dark;
    --fondo: #f4f6f8;
    --texto: #1a2027;
    --tenue: #5b6875;
    --caja: #ffffff;
    --borde: #dde3ea;
    --campo: #ffffff;
    --acento: #1f5fbf;
    --acento-texto: #ffffff;
    --votado: #17784a;
    --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #121820;
      --texto: #e8eef5;
      --tenue: #9aa9b8;
      --caja: #1b232e;
      --borde: #2b3644;
      --campo: #141b24;
      --acento: #5b9bf5;
      --acento-texto: #0d1219;
      --votado: #58c98f;
      --error: #f2837b;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--fondo);
    color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.55;
    padding: 24px 18px 56px;
  }

  .hoja { max-width: 620px; margin: 0 auto; }

  header { padding: 24px 0 20px; }

  h1 {
    font-size: clamp(26px, 7vw, 38px);
    line-height: 1.15;
    margin: 0 0 10px;
    letter-spacing: -0.02em;
  }

  .para-que {
    margin: 0;
    font-size: clamp(16px, 4.2vw, 18px);
    color: var(--tenue);
    max-width: 46ch;
  }

  /* ---- pestañas ---- */

  .pestanas {
    display: flex;
    gap: 6px;
    border-bottom: 1px solid var(--borde);
    margin-bottom: 24px;
  }

  .pestanas button {
    flex: 1;
    font: inherit;
    font-size: clamp(14px, 3.8vw, 15px);
    font-weight: 600;
    color: var(--tenue);
    background: none;
    border: 0;
    border-bottom: 3px solid transparent;
    padding: 13px 8px;
    cursor: pointer;
    min-height: 48px;
  }

  .pestanas button[aria-selected="true"] {
    color: var(--texto);
    border-bottom-color: var(--acento);
  }

  /* ---- lista de propuestas ---- */

  ul { list-style: none; margin: 0; padding: 0; }

  li {
    background: var(--caja);
    border: 1px solid var(--borde);
    border-radius: 14px;
    padding: clamp(16px, 4.5vw, 22px);
    margin-bottom: 12px;
  }

  .lugar {
    font-size: clamp(18px, 4.8vw, 20px);
    margin: 0 0 4px;
    overflow-wrap: anywhere;
  }

  .quien {
    margin: 0 0 10px;
    font-size: 14px;
    color: var(--tenue);
  }

  .porque {
    margin: 0 0 16px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .votar {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .votar button {
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    color: var(--acento-texto);
    background: var(--acento);
    border: 0;
    border-radius: 9px;
    padding: 11px 18px;
    cursor: pointer;
    min-height: 44px;
  }

  .votar button[disabled] {
    background: none;
    color: var(--votado);
    border: 1px solid var(--borde);
    cursor: default;
  }

  .cuenta { font-size: 14px; color: var(--tenue); }

  /* ---- formulario ---- */

  form {
    background: var(--caja);
    border: 1px solid var(--borde);
    border-radius: 14px;
    padding: clamp(18px, 5vw, 26px);
  }

  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .opcional { font-weight: 400; color: var(--tenue); }

  input, textarea {
    width: 100%;
    font: inherit;
    font-size: 16px; /* 16px evita que el celular haga zoom al enfocar */
    color: var(--texto);
    background: var(--campo);
    border: 1px solid var(--borde);
    border-radius: 9px;
    padding: 11px 13px;
    margin-bottom: 18px;
  }

  textarea { min-height: 110px; resize: vertical; }

  input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--acento);
    outline-offset: 2px;
  }

  form button {
    width: 100%;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    color: var(--acento-texto);
    background: var(--acento);
    border: 0;
    border-radius: 9px;
    padding: 13px 20px;
    cursor: pointer;
    min-height: 48px;
  }

  form button:disabled { opacity: .55; cursor: default; }

  .aviso { margin: 14px 0 0; font-size: 15px; min-height: 1.5em; }
  .aviso.malo { color: var(--error); }

  .vacio { color: var(--tenue); margin: 0; }
</style>
</head>
<body>
  <div class="hoja">

    <header>
      <h1>Cena de fin de año</h1>
      <p class="para-que">Propón un lugar, di por qué te late, y vota los que
        proponga el resto. Gana el que junte más votos.</p>
    </header>

    <div class="pestanas" role="tablist">
      <button role="tab" id="tab-lista" aria-controls="vista-lista"
              aria-selected="true">Propuestas</button>
      <button role="tab" id="tab-nueva" aria-controls="vista-nueva"
              aria-selected="false">Proponer un lugar</button>
    </div>

    <section id="vista-lista" role="tabpanel" aria-labelledby="tab-lista">
      <div id="lista"><p class="vacio">Cargando…</p></div>
    </section>

    <section id="vista-nueva" role="tabpanel" aria-labelledby="tab-nueva" hidden>
      <form id="forma">
        <label for="lugar">Nombre del lugar</label>
        <input id="lugar" name="lugar" type="text" maxlength="120" required
               placeholder="Ej. La Casa de Toño, Insurgentes">

        <label for="nombre">Quién lo recomienda <span class="opcional">— opcional</span></label>
        <input id="nombre" name="nombre" type="text" maxlength="80"
               autocomplete="name" placeholder="Puedes dejarlo en blanco">

        <label for="mensaje">Por qué</label>
        <textarea id="mensaje" name="mensaje" maxlength="600" required
                  placeholder="En pocas líneas: qué tiene de bueno, si cabemos todos, cómo anda de precio."></textarea>

        <button type="submit" id="enviar">Enviar propuesta</button>
        <p class="aviso" id="aviso" role="status" aria-live="polite"></p>
      </form>
    </section>

  </div>

<script>
// Esta llave es la publicable: está hecha para andar a la vista.
const SUPABASE_URL = "https://weiyenrtizkilldcnkeg.supabase.co";
const SUPABASE_KEY = "sb_publishable_CgSxUfOmp6Z24ypD0UyW2w_vnlebCfY";

const REST = SUPABASE_URL + "/rest/v1/";
const cabeceras = { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY };

// Identificador de este navegador. No es autenticación: solo evita que
// alguien vote dos veces por descuido desde el mismo teléfono.
const votante = (() => {
  const clave = "cena-votante";
  let v = null;
  try { v = localStorage.getItem(clave); } catch (e) { /* modo privado */ }
  if (!v) {
    v = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
    try { localStorage.setItem(clave, v); } catch (e) { /* modo privado */ }
  }
  return v;
})();

/* ---------- pestañas ---------- */

const tabs = {
  "tab-lista": document.getElementById("vista-lista"),
  "tab-nueva": document.getElementById("vista-nueva")
};

for (const id of Object.keys(tabs)) {
  document.getElementById(id).addEventListener("click", () => mostrar(id));
}

function mostrar(activo) {
  for (const id of Object.keys(tabs)) {
    const esActivo = id === activo;
    document.getElementById(id).setAttribute("aria-selected", String(esActivo));
    tabs[id].hidden = !esActivo;
  }
}

/* ---------- lista y votos ---------- */

const lista = document.getElementById("lista");

async function traer() {
  try {
    const [rp, rv] = await Promise.all([
      fetch(REST + "registros?select=id,lugar,nombre,mensaje,created_at", { headers: cabeceras }),
      fetch(REST + "votos?select=registro_id", { headers: cabeceras })
    ]);
    if (!rp.ok) throw new Error(await rp.text());
    if (!rv.ok) throw new Error(await rv.text());

    const propuestas = await rp.json();
    const votos = await rv.json();

    const cuenta = new Map();
    for (const v of votos) cuenta.set(v.registro_id, (cuenta.get(v.registro_id) || 0) + 1);

    // Más votadas primero; a empate, la más reciente arriba.
    propuestas.sort((a, b) => {
      const d = (cuenta.get(b.id) || 0) - (cuenta.get(a.id) || 0);
      return d !== 0 ? d : String(b.created_at).localeCompare(String(a.created_at));
    });

    pintar(propuestas, cuenta);
  } catch (e) {
    aviso_lista("No se pudieron cargar las propuestas. Recarga la página.");
    console.error(e);
  }
}

function aviso_lista(texto) {
  lista.innerHTML = "";
  const p = document.createElement("p");
  p.className = "vacio";
  p.textContent = texto;
  lista.appendChild(p);
}

function pintar(propuestas, cuenta) {
  if (!propuestas.length) {
    aviso_lista("Todavía no hay propuestas. La tuya sería la primera.");
    return;
  }

  const yaVote = votados();
  lista.innerHTML = "";
  const ul = document.createElement("ul");

  for (const p of propuestas) {
    const li = document.createElement("li");

    const h = document.createElement("h2");
    h.className = "lugar";
    h.textContent = p.lugar || "(sin nombre)";
    li.appendChild(h);

    const quien = document.createElement("p");
    quien.className = "quien";
    quien.textContent = "Lo recomienda " + ((p.nombre || "").trim() || "alguien anónimo");
    li.appendChild(quien);

    const porque = document.createElement("p");
    porque.className = "porque";
    porque.textContent = p.mensaje || "";
    li.appendChild(porque);

    const total = cuenta.get(p.id) || 0;
    const fila = document.createElement("div");
    fila.className = "votar";

    const boton = document.createElement("button");
    const votado = yaVote.includes(p.id);
    boton.textContent = votado ? "Ya votaste" : "Votar";
    boton.disabled = votado;
    boton.addEventListener("click", () => votar(p.id, boton));
    fila.appendChild(boton);

    const marca = document.createElement("span");
    marca.className = "cuenta";
    marca.textContent = total === 1 ? "1 voto" : total + " votos";
    fila.appendChild(marca);

    li.appendChild(fila);
    ul.appendChild(li);
  }

  lista.appendChild(ul);
}

function votados() {
  try { return JSON.parse(localStorage.getItem("cena-votados") || "[]"); }
  catch (e) { return []; }
}

function anotarVoto(id) {
  try {
    const v = votados();
    if (!v.includes(id)) localStorage.setItem("cena-votados", JSON.stringify(v.concat(id)));
  } catch (e) { /* modo privado */ }
}

async function votar(registro_id, boton) {
  boton.disabled = true;
  try {
    const r = await fetch(REST + "votos", {
      method: "POST",
      headers: Object.assign({}, cabeceras, {
        "Content-Type": "application/json",
        Prefer: "return=minimal"
      }),
      body: JSON.stringify({ registro_id, votante })
    });
    // 409 = ya había un voto de este navegador para esta propuesta.
    if (!r.ok && r.status !== 409) throw new Error(await r.text());
    anotarVoto(registro_id);
    traer();
  } catch (e) {
    boton.disabled = false;
    console.error(e);
  }
}

/* ---------- formulario ---------- */

const forma  = document.getElementById("forma");
const aviso  = document.getElementById("aviso");
const enviar = document.getElementById("enviar");

function decir(texto, malo) {
  aviso.textContent = texto;
  aviso.classList.toggle("malo", Boolean(malo));
}

forma.addEventListener("submit", async (ev) => {
  ev.preventDefault();

  const lugar   = document.getElementById("lugar").value.trim();
  const nombre  = document.getElementById("nombre").value.trim();
  const mensaje = document.getElementById("mensaje").value.trim();

  if (!lugar)   { decir("Escribe el nombre del lugar.", true); return; }
  if (!mensaje) { decir("Escribe por qué lo propones.", true); return; }

  enviar.disabled = true;
  decir("Enviando…");

  try {
    const r = await fetch(REST + "registros", {
      method: "POST",
      headers: Object.assign({}, cabeceras, {
        "Content-Type": "application/json",
        Prefer: "return=minimal"
      }),
      body: JSON.stringify({ lugar, nombre: nombre || null, mensaje })
    });
    if (!r.ok) throw new Error(await r.text());

    forma.reset();
    decir("Listo. Tu propuesta ya está en la lista.");
    await traer();
    mostrar("tab-lista");
  } catch (e) {
    decir("No se pudo enviar. Inténtalo otra vez.", true);
    console.error(e);
  } finally {
    enviar.disabled = false;
  }
});

traer();
</script>
</body>
</html>
